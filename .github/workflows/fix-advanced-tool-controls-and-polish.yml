name: Fix Advanced Tool enforcement and UI polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Advanced Tools without replacing functionality
        shell: python
        run: |
          from pathlib import Path
          p=Path('frontend/src/pages/AdvancedTools.jsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import { useEffect, useRef, useState } from "react";', 'import { useEffect, useRef, useState } from "react";\nimport { useNavigate, useParams } from "react-router-dom";')
          s=s.replace('["ai-image","AI Image Generator",Sparkles,"AI image generation is currently unavailable."],', '["ai-image","AI Image Generator",Sparkles,"Generate images from text prompts."],')
          s=s.replace('export default function AdvancedTools(){\n const [active,setActive]=useState("analyzer")', 'export default function AdvancedTools(){\n const navigate=useNavigate(); const { tool: routeTool }=useParams();\n const [active,setActive]=useState(routeTool||"analyzer")')
          old='const tool=tools.find(t=>t[0]===active);\n const isMobile='
          new='const tool=tools.find(t=>t[0]===active)||tools[0];\n const [enabledTools,setEnabledTools]=useState({}); const [toolsLoading,setToolsLoading]=useState(true);\n const visibleTools=tools.filter(([id])=>enabledTools[id]!==false);\n useEffect(()=>{let alive=true;fetch(`${API}/admin/tools/status`,{cache:"no-store"}).then(r=>r.json()).then(d=>{if(alive)setEnabledTools(d.tools||{})}).catch(()=>{if(alive)setEnabledTools({})}).finally(()=>alive&&setToolsLoading(false));return()=>{alive=false}},[]);\n useEffect(()=>{if(toolsLoading)return;const first=visibleTools[0]?.[0]||"analyzer";if(routeTool&&enabledTools[routeTool]!==false){setActive(routeTool);return}if(enabledTools[active]===false||!visibleTools.some(([id])=>id===active)){setActive(first);if(routeTool!==first)navigate(`/advanced-tools/${first}`,{replace:true})}},[toolsLoading,routeTool,active,enabledTools,navigate]);\n const isMobile='
          if old in s:s=s.replace(old,new,1)
          s=s.replace('async function run(){setResult(null);if(active==="ai-image"){setResult({info:"This feature is currently unavailable"});return}if(active==="scan")return;', 'async function run(){setResult(null);if(!toolsLoading&&enabledTools[active]===false){setResult({error:"This tool is currently disabled by the administrator."});return}if(active==="ai-image"){setResult({info:"AI Image Generator is not enabled."});return}if(active==="scan")return;')
          s=s.replace('const openQRText=', 'const API=(import.meta.env.VITE_API_URL||"https://convertflow-backend.onrender.com/api").replace(/\\/$/,"");\n const openQRText=',1)
          old_button='<button className={active===id?"active":""} key={id} onClick={()=>{stopCamera();setActive(id);setResult(null);setFiles([])}}><Icon size={17}/>{name}</button>'
          new_button='<button className={active===id?"active":""} key={id} onClick={()=>{stopCamera();setResult(null);setFiles([]);navigate(`/advanced-tools/${id}`)}}><Icon size={17}/>{name}</button>'
          s=s.replace(old_button,new_button)
          s=s.replace('const q=e.target.value.toLowerCase();const first=tools.find(t=>t[1].toLowerCase().includes(q));if(first)setActive(first[0])', 'const q=e.target.value.toLowerCase();const first=visibleTools.find(t=>t[1].toLowerCase().includes(q));if(first)navigate(`/advanced-tools/${first[0]}`)')
          old_map='{tools.map(([id,name,Icon])=><button'
          s=s.replace(old_map,'{visibleTools.map(([id,name,Icon])=><button',1)
          old_head='<div className="advanced-panel-head"><div><span>UTILITY</span><h2>{tool[1]}</h2><p>{tool[3]}</p></div>'
          new_head='<div className="advanced-panel-head"><div><div className="advanced-breadcrumb"><button className="advanced-back" type="button" onClick={()=>navigate("/advanced-tools")}><span aria-hidden="true">←</span> All Tools</button><span>UTILITY</span></div><h2>{tool[1]}</h2><p>{tool[3]}</p></div>'
          s=s.replace(old_head,new_head,1)
          s=s.replace('{active==="ai-image"&&<div className="advanced-info">This feature is currently unavailable</div>}','')
          p.write_text(s,encoding='utf-8')

      - name: Make Advanced Tool controls visibly animated and accessible
        shell: python
        run: |
          from pathlib import Path
          p=Path('frontend/src/pages/advancedTools.css')
          s=p.read_text(encoding='utf-8')
          extra='''\n.advanced-breadcrumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}.advanced-back{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid rgba(148,163,184,.22);border-radius:12px;background:rgba(255,255,255,.055);color:inherit;font-weight:800;cursor:pointer;transition:transform .2s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease}.advanced-back:hover{transform:translateY(-2px);border-color:rgba(239,68,68,.42);box-shadow:0 10px 28px rgba(0,0,0,.18)}.advanced-breadcrumb>span{display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;border:1px solid rgba(239,68,68,.18);background:rgba(239,68,68,.08);font-size:11px;font-weight:900;letter-spacing:1.4px}.advanced-tools .advanced-layout>aside button{transition:transform .2s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease;color:inherit}.advanced-tools .advanced-layout>aside button:hover{transform:translateX(4px)}.advanced-tools .advanced-panel{animation:cfAdvancedPanelIn .38s cubic-bezier(.2,.8,.2,1) both}.advanced-tools .advanced-files span{animation:cfChipIn .32s ease both}@keyframes cfAdvancedPanelIn{from{opacity:.65;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes cfChipIn{from{opacity:0;transform:scale(.96) translateY(4px)}to{opacity:1;transform:none}}\n'''
          if '.advanced-breadcrumb{' not in s:s += extra
          p.write_text(s,encoding='utf-8')

      - name: Strengthen site-wide entrance, hover, card, and light-theme polish
        shell: python
        run: |
          from pathlib import Path
          p=Path('frontend/src/sitePolish.css')
          s=p.read_text(encoding='utf-8')
          extra='''\n/* Stronger site-wide motion and visual polish */\n@keyframes cfReveal{from{opacity:0;transform:translateY(18px) scale(.99)}to{opacity:1;transform:none}}\n@keyframes cfSoftGlow{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 0 7px rgba(239,68,68,.08)}}\n.app main>*{animation:cfReveal .46s cubic-bezier(.2,.8,.2,1) both}.app main>*:nth-child(2){animation-delay:.05s}.app main>*:nth-child(3){animation-delay:.1s}.app main>*:nth-child(4){animation-delay:.15s}.app main>*:nth-child(5){animation-delay:.2s}\nbutton,.auth-submit,a,.info-card,.seo-section,.te-card,.te-workspace,.advanced-panel,.advanced-card,.status-row,.dropdown-menu,.converter-card,.file-item,.tool-card{will-change:transform;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,border-color .22s ease,background-color .22s ease,color .22s ease}\nbutton:hover:not(:disabled),.auth-submit:hover{transform:translateY(-3px)}.info-card:hover,.seo-section:hover,.te-card:hover,.tool-card:hover,.file-item:hover{transform:translateY(-4px);box-shadow:0 20px 48px rgba(15,23,42,.14)}.dropdown-menu a:hover,.nav-button:hover,.nav-link:hover{transform:translateX(3px)}.theme-button:hover{transform:rotate(8deg) scale(1.05)}\nhtml[data-theme="light"]{background:#eef3f8}html[data-theme="light"] body{background:radial-gradient(circle at 5% 0%,rgba(239,68,68,.09),transparent 27%),radial-gradient(circle at 96% 12%,rgba(14,165,233,.08),transparent 24%),linear-gradient(180deg,#f9fbfd 0%,#edf2f7 100%)!important;color:#182230!important}html[data-theme="light"] .site-header{background:rgba(255,255,255,.9)!important;border-bottom:1px solid rgba(15,23,42,.08)!important;box-shadow:0 12px 36px rgba(15,23,42,.09)!important}html[data-theme="light"] .nav-button,html[data-theme="light"] .nav-link,html[data-theme="light"] .sign-in{color:#425066!important}html[data-theme="light"] .nav-button:hover,html[data-theme="light"] .nav-link:hover{background:rgba(15,23,42,.055);color:#172033!important}html[data-theme="light"] .dropdown-menu{background:rgba(255,255,255,.98)!important;border-color:rgba(15,23,42,.10)!important;box-shadow:0 20px 55px rgba(15,23,42,.13)!important}html[data-theme="light"] .dropdown-menu a{color:#526074!important}html[data-theme="light"] .dropdown-menu a:hover{background:#f3f6f9;color:#172033!important}html[data-theme="light"] .hero p,html[data-theme="light"] .section-heading p{color:#59677b!important}html[data-theme="light"] .converter-card{background:rgba(255,255,255,.88)!important;border-color:rgba(15,23,42,.10)!important;box-shadow:0 24px 70px rgba(15,23,42,.10)!important}html[data-theme="light"] .drop-zone{background:radial-gradient(circle at center,rgba(239,68,68,.07),transparent 58%)!important;border-color:rgba(15,23,42,.15)!important}html[data-theme="light"] .format-card{background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(245,248,251,.9));border-color:rgba(15,23,42,.10);box-shadow:0 18px 44px rgba(15,23,42,.10)}html[data-theme="light"] .format-card strong{color:#172033}html[data-theme="light"] .format-card span{color:#627086}html[data-theme="light"] .refresh-icon{background:#fff;color:#4c5b70;border-color:rgba(15,23,42,.10)}html[data-theme="light"] .advanced-tools{background:linear-gradient(180deg,#f8fafc,#eef3f8)!important;color:#172033!important}html[data-theme="light"] .advanced-tools .advanced-layout>aside,html[data-theme="light"] .advanced-panel,html[data-theme="light"] .advanced-card{background:rgba(255,255,255,.9)!important;border-color:rgba(15,23,42,.1)!important;box-shadow:0 18px 44px rgba(15,23,42,.08)!important}html[data-theme="light"] .advanced-tools .advanced-layout>aside button{color:#3e4c60}html[data-theme="light"] .advanced-tools .advanced-layout>aside button.active{background:rgba(239,68,68,.08);color:#b42318;border-color:rgba(239,68,68,.18)}html[data-theme="light"] .advanced-back{background:#fff!important;color:#243044!important;border-color:rgba(15,23,42,.12)!important}html[data-theme="light"] .advanced-breadcrumb>span{background:rgba(239,68,68,.07)!important;color:#b42318!important;border-color:rgba(239,68,68,.16)!important}\n.admin-tool-settings-page,.admin-control-page,.content-page,.donate-page,.seo-page{animation:cfReveal .46s ease both}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}\n'''
          if 'Stronger site-wide motion and visual polish' not in s:s += extra
          p.write_text(s,encoding='utf-8')

      - name: Build frontend to catch syntax errors
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run build

      - name: Remove this helper workflow and commit the actual fix
        shell: bash
        run: |
          git rm .github/workflows/fix-advanced-tool-controls-and-polish.yml
          git add frontend/src/pages/AdvancedTools.jsx frontend/src/pages/advancedTools.css frontend/src/sitePolish.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Enforce Advanced Tool availability and improve site animations' || true
          git push
