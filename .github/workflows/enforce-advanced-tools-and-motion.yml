name: Enforce Advanced Tool controls and strengthen UI motion
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Advanced Tool availability enforcement
        shell: python
        run: |
          from pathlib import Path
          p=Path('frontend/src/pages/AdvancedTools.jsx')
          s=p.read_text(encoding='utf-8')
          if 'useNavigate, useParams' not in s:
              s=s.replace('import { useEffect, useRef, useState } from "react";', 'import { useEffect, useRef, useState } from "react";\nimport { useNavigate, useParams } from "react-router-dom";')
          if 'const API=(' not in s:
              s=s.replace('const fmt=', 'const API=(import.meta.env.VITE_API_URL||"https://convertflow-backend.onrender.com/api").replace(/\\/$/,"");\nconst fmt=', 1)
          s=s.replace('["ai-image","AI Image Generator",Sparkles,"AI image generation is currently unavailable."],', '["ai-image","AI Image Generator",Sparkles,"Generate images from text prompts."],')
          s=s.replace('export default function AdvancedTools(){\n const [active,setActive]=useState("analyzer")', 'export default function AdvancedTools(){\n const navigate=useNavigate(); const {tool:routeTool}=useParams();\n const [active,setActive]=useState(routeTool||"analyzer")')
          marker=' const tool=tools.find(t=>t[0]===active);\n const isMobile='
          insert=''' const tool=tools.find(t=>t[0]===active)||tools[0];\n const [enabledTools,setEnabledTools]=useState({}); const [toolsLoading,setToolsLoading]=useState(true);\n const visibleTools=tools.filter(([id])=>enabledTools[id]!==false);\n useEffect(()=>{let alive=true;fetch(`${API}/admin/tools/status`,{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(d=>{if(alive)setEnabledTools(d.tools||{})}).catch(()=>{if(alive)setEnabledTools({})}).finally(()=>{if(alive)setToolsLoading(false)});return()=>{alive=false}},[]);\n useEffect(()=>{if(toolsLoading)return;const first=visibleTools[0]?.[0]||"analyzer";if(routeTool&&enabledTools[routeTool]!==false){if(active!==routeTool)setActive(routeTool);return}if(enabledTools[active]===false||!visibleTools.some(([id])=>id===active)){setActive(first);navigate(`/advanced-tools/${first}`,{replace:true})}},[toolsLoading,routeTool,active,enabledTools,navigate]);\n const isMobile='''
          if marker in s and 'const [enabledTools' not in s:
              s=s.replace(marker,insert,1)
          s=s.replace('async function run(){setResult(null);if(active==="ai-image"){setResult({info:"This feature is currently unavailable"});return}if(active==="scan")return;', 'async function run(){setResult(null);if(!toolsLoading&&enabledTools[active]===false){setResult({error:"This tool is disabled by the administrator."});return}if(active==="ai-image"){setResult({error:"This tool is not enabled."});return}if(active==="scan")return;')
          old='onChange={e=>{const q=e.target.value.toLowerCase();const first=tools.find(t=>t[1].toLowerCase().includes(q));if(first)setActive(first[0])}}'
          new='onChange={e=>{const q=e.target.value.toLowerCase();const first=visibleTools.find(t=>t[1].toLowerCase().includes(q));if(first)navigate(`/advanced-tools/${first[0]}`)}}'
          s=s.replace(old,new)
          old='{tools.map(([id,name,Icon])=><button className={active===id?"active":""} key={id} onClick={()=>{stopCamera();setActive(id);setResult(null);setFiles([])}}>'
          new='{visibleTools.map(([id,name,Icon])=><button className={active===id?"active":""} key={id} onClick={()=>{stopCamera();setResult(null);setFiles([]);navigate(`/advanced-tools/${id}`)}}>'
          s=s.replace(old,new)
          old='<div className="advanced-panel-head"><div><span>UTILITY</span><h2>{tool[1]}</h2><p>{tool[3]}</p></div>'
          new='<div className="advanced-panel-head"><div><div className="advanced-breadcrumb"><button className="advanced-back" type="button" onClick={()=>navigate("/advanced-tools")}><span aria-hidden="true">←</span> All Tools</button><span>UTILITY</span></div><h2>{tool[1]}</h2><p>{tool[3]}</p></div>'
          s=s.replace(old,new)
          s=s.replace('{active==="ai-image"&&<div className="advanced-info">This feature is currently unavailable</div>}','')
          p.write_text(s,encoding='utf-8')
      - name: Apply stronger motion and light theme
        shell: python
        run: |
          from pathlib import Path
          p=Path('frontend/src/sitePolish.css')
          s=p.read_text(encoding='utf-8')
          if '/* Advanced Tools enforcement + motion v2 */' not in s:
              s += '''\n/* Advanced Tools enforcement + motion v2 */\n@keyframes cfRevealV2{0%{opacity:0;transform:translateY(18px) scale(.985)}100%{opacity:1;transform:none}}\n@keyframes cfHoverGlow{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 0 6px rgba(239,68,68,.07)}}\n.app main{animation:cfRevealV2 .5s cubic-bezier(.16,1,.3,1) both}\n.app main>*{animation:cfRevealV2 .5s cubic-bezier(.16,1,.3,1) both}\n.app main>*:nth-child(2){animation-delay:.06s}.app main>*:nth-child(3){animation-delay:.12s}.app main>*:nth-child(4){animation-delay:.18s}.app main>*:nth-child(5){animation-delay:.24s}.app main>*:nth-child(6){animation-delay:.30s}\nbutton,.auth-submit,.info-card,.seo-section,.te-card,.te-workspace,.advanced-panel,.advanced-card,.status-row,.converter-card,.file-item,.tool-card,.donate-qr-card{transition:transform .24s cubic-bezier(.16,1,.3,1),box-shadow .24s ease,border-color .24s ease,background-color .24s ease,color .24s ease}\nbutton:hover:not(:disabled),.auth-submit:hover{transform:translateY(-3px)}.info-card:hover,.seo-section:hover,.te-card:hover,.tool-card:hover,.file-item:hover,.donate-qr-card:hover{transform:translateY(-5px);box-shadow:0 22px 52px rgba(15,23,42,.15)}\n.admin-tool-settings-page label:hover,.advanced-tools .advanced-layout>aside button:hover{transform:translateX(4px);box-shadow:0 10px 28px rgba(15,23,42,.09)}\n.advanced-breadcrumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.advanced-back{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid rgba(148,163,184,.22);border-radius:12px;background:rgba(255,255,255,.055);color:inherit;font-weight:800;cursor:pointer}.advanced-back:hover{transform:translateY(-2px);border-color:rgba(239,68,68,.42);box-shadow:0 10px 26px rgba(0,0,0,.18)}.advanced-breadcrumb>span{display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.16);font-size:11px;font-weight:900;letter-spacing:1.4px}\nhtml[data-theme="light"] body{background:radial-gradient(circle at 5% 0%,rgba(239,68,68,.09),transparent 27%),radial-gradient(circle at 95% 10%,rgba(14,165,233,.08),transparent 25%),linear-gradient(180deg,#fafcff 0%,#edf2f7 100%)!important;color:#172033!important}html[data-theme="light"] .site-header{background:rgba(255,255,255,.9)!important;border-bottom:1px solid rgba(15,23,42,.08)!important;box-shadow:0 12px 38px rgba(15,23,42,.09)!important}html[data-theme="light"] .nav-button,html[data-theme="light"] .nav-link,html[data-theme="light"] .sign-in{color:#425066!important}html[data-theme="light"] .nav-button:hover,html[data-theme="light"] .nav-link:hover{background:rgba(15,23,42,.05);color:#172033!important}html[data-theme="light"] .converter-card,html[data-theme="light"] .te-workspace,html[data-theme="light"] .te-card,html[data-theme="light"] .info-card,html[data-theme="light"] .seo-section{background:rgba(255,255,255,.9)!important;border-color:rgba(15,23,42,.1)!important;box-shadow:0 16px 42px rgba(15,23,42,.08)!important}html[data-theme="light"] input,html[data-theme="light"] textarea,html[data-theme="light"] select{background:#fff!important;color:#172033!important;border-color:rgba(15,23,42,.14)!important}html[data-theme="light"] p,html[data-theme="light"] small{color:#56657a!important}html[data-theme="light"] .drop-zone{background:radial-gradient(circle at center,rgba(239,68,68,.06),transparent 58%)!important;border-color:rgba(15,23,42,.14)!important}html[data-theme="light"] .status-notification-toggle{background:#fff!important;color:#172033!important;border-color:rgba(15,23,42,.13)!important}html[data-theme="light"] .advanced-back{background:#fff!important;color:#172033!important;border-color:rgba(15,23,42,.13)!important}\n@media(max-width:760px){.app main>*{animation-delay:0s!important}.advanced-breadcrumb{align-items:flex-start}.advanced-back{min-height:42px}.admin-tool-settings-page label:hover,.advanced-tools .advanced-layout>aside button:hover{transform:none}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}\n'''
          p.write_text(s,encoding='utf-8')
      - name: Add admin settings animation hook
        shell: python
        run: |
          from pathlib import Path
          p=Path('frontend/src/pages/AdminToolSettings.jsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div style={{minHeight:"100vh"', '<div className="admin-tool-settings-page" style={{minHeight:"100vh"',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit the actual fixes
        shell: bash
        run: |
          git rm -f .github/workflows/enforce-advanced-tools-and-motion.yml
          git add frontend/src/pages/AdvancedTools.jsx frontend/src/pages/advancedTools.css frontend/src/sitePolish.css frontend/src/pages/AdminToolSettings.jsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Enforce Advanced Tool availability and improve site motion' || true
          git push
