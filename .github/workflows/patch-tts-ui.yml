name: Improve ConvertFlow TTS UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch TTS UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('frontend/src/pages/AdvancedTools.jsx')
          s=p.read_text()
          s=s.replace('["tts","Text to Audio",Sparkles,"Turn text into natural speech with Fish Audio."]','["tts","Text to Audio",Sparkles,"Turn text into natural speech with free Deepgram Flux voices."]')
          s=s.replace('[aiPrompt,setAiPrompt]=useState(""),[aiSize,setAiSize]=useState("1K"),[aiGenerating,setAiGenerating]=useState(false),[ttsText,setTtsText]=useState(""),[ttsSpeed,setTtsSpeed]=useState("1"),[ttsGenerating,setTtsGenerating]=useState(false),','[aiPrompt,setAiPrompt]=useState(""),[aiSize,setAiSize]=useState("1K"),[aiGenerating,setAiGenerating]=useState(false),[ttsText,setTtsText]=useState(""),[ttsSpeed,setTtsSpeed]=useState("1"),[ttsVoice,setTtsVoice]=useState("flux-haley-en"),[ttsGenerating,setTtsGenerating]=useState(false),')
          s=s.replace('body:JSON.stringify({text:ttsText,speed:ttsSpeed})','body:JSON.stringify({text:ttsText,speed:ttsSpeed,voice:ttsVoice})')
          old='''{active==="tts"&&<div className="advanced-ai-form"><textarea className="advanced-input" rows="7" value={ttsText} onChange={e=>setTtsText(e.target.value)} placeholder="Type the text you want to hear..."/><label className="advanced-input-row">Voice speed <input type="range" min="0.5" max="2" step="0.1" value={ttsSpeed} onChange={e=>setTtsSpeed(e.target.value)}/><span>{ttsSpeed}×</span></label><button className="advanced-run" disabled={ttsGenerating} onClick={run}><Sparkles size={17}/>{ttsGenerating?"Generating audio...":"Generate audio"}</button></div>}'''
          new='''{active==="tts"&&<div className="advanced-ai-form tts-builder"><textarea className="advanced-input" rows="7" value={ttsText} onChange={e=>setTtsText(e.target.value)} placeholder="Type the text you want to hear..."/><div className="tts-controls"><label>Voice<select className="advanced-input" value={ttsVoice} onChange={e=>setTtsVoice(e.target.value)}><option value="flux-haley-en">Haley · American female</option><option value="flux-kit-en">Kit · British male</option><option value="flux-alexis-en">Alexis · American female</option><option value="flux-cliff-en">Cliff · Deep American male</option><option value="flux-sienna-en">Sienna · Warm American female</option><option value="flux-meena-en">Meena · Indian female</option></select></label><label>Speed<input type="range" min="0.85" max="1.15" step="0.05" value={ttsSpeed} onChange={e=>setTtsSpeed(e.target.value)}/><span>{ttsSpeed}×</span></label></div><button className="advanced-run" disabled={ttsGenerating} onClick={run}><Sparkles size={17}/>{ttsGenerating?"Generating audio...":"Generate audio"}</button></div>}'''
          if old in s: s=s.replace(old,new)
          old2='{result?.audioUrl&&<div className="advanced-result"><audio controls src={result.audioUrl} style={{width:"100%"}}/><button onClick={async()=>{const r=await fetch(result.audioUrl);download(await r.blob(),result.name)}}><Download size={16}/> Download MP3</button></div>}'
          new2='''{result?.ttsLoading&&<div className="advanced-result tts-loading"><div className="tts-wave">{Array.from({length:28},(_,i)=><i key={i} style={{animationDelay:`${i*0.035}s`}}/> )}</div><strong>Creating your voice...</strong><span>Deepgram Flux is generating the audio</span></div>}{result?.audioUrl&&<div className="advanced-result tts-result"><div className="tts-result-top"><div className="tts-avatar"><Sparkles size={18}/></div><div><strong>ConvertFlow Voice</strong><span>{ttsVoice.replace('flux-','').replace('-en','')} · AI generated</span></div></div><div className="tts-wave tts-static">{Array.from({length:36},(_,i)=><i key={i} style={{height:`${12+((i*17)%34)}px`}}/> )}</div><audio controls src={result.audioUrl}/><button onClick={async()=>{const r=await fetch(result.audioUrl);download(await r.blob(),result.name)}}><Download size={16}/> Download MP3</button></div>}'''
          if old2 in s: s=s.replace(old2,new2)
          p.write_text(s)

          css=Path('frontend/src/pages/advancedTools.css')
          css.write_text(css.read_text()+'\n.tts-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tts-controls label{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600}.tts-controls input[type=range]{width:100%}.tts-result,.tts-loading{padding:22px;border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 50px rgba(0,0,0,.16)}.tts-result-top{display:flex;align-items:center;gap:12px}.tts-result-top div:last-child{display:flex;flex-direction:column;gap:3px}.tts-result-top span,.tts-loading span{font-size:12px;opacity:.55}.tts-avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1)}.tts-wave{height:68px;display:flex;align-items:center;justify-content:center;gap:3px;margin:18px 0}.tts-wave i{display:block;width:3px;border-radius:8px;background:currentColor;opacity:.75;animation:ttsWave .8s ease-in-out infinite alternate}.tts-static i{animation:none;opacity:.6}.tts-result audio{width:100%;height:40px}.tts-result button{margin-top:14px}@keyframes ttsWave{from{transform:scaleY(.35);opacity:.35}to{transform:scaleY(1);opacity:.95}}@media(max-width:700px){.tts-controls{grid-template-columns:1fr}}\n')
      - name: Commit UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/AdvancedTools.jsx frontend/src/pages/advancedTools.css
          git diff --cached --quiet || git commit -m 'Add TTS voice selector and custom audio preview'
          git push
